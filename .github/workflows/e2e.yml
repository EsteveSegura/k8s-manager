name: E2E tests

# Pull requests and main only: feature branches without a PR don't run the suite.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (kind)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            server/package-lock.json
            e2e/package-lock.json

      # Only installs kind and kubectl: e2e/scripts/cluster-up.sh creates the
      # cluster, exactly as it does locally.
      - uses: helm/kind-action@v1
        with:
          version: v0.33.0
          install_only: true

      - uses: azure/setup-helm@v5

      - name: Install dependencies
        run: |
          npm ci --prefix web
          npm ci --prefix server
          npm ci --prefix e2e
          cd e2e && npx playwright install --with-deps chromium

      - name: Create and seed the kind cluster
        run: npm run cluster:up --prefix e2e

      - name: Run Playwright (with frontend coverage)
        working-directory: e2e
        run: npm run test:coverage

      - name: Coverage summary
        if: always()
        working-directory: e2e
        run: |
          [ -f coverage/coverage-summary.json ] || exit 0
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const rows = ["lines", "statements", "functions", "branches"].map((k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`);
            console.log(["### E2E frontend coverage", "", "| | % | covered |", "|---|---|---|", ...rows].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e2e-coverage
          path: e2e/coverage/
          if-no-files-found: ignore
          retention-days: 14

      - name: Dump cluster state
        if: failure()
        env:
          KUBECONFIG: e2e/.kube/admin.config
        run: |
          kubectl get all,events -A -o wide || true
          kubectl -n e2e describe pods || true

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 14
