# Identity the app runs as during the e2e tests: it can read everything and
# write nothing, so any write attempt would also be rejected by the cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: e2e-access
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-manager
  namespace: e2e-access
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-manager-read-only
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["*"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-manager-read-only
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-manager-read-only
subjects:
  - kind: ServiceAccount
    name: k8s-manager
    namespace: e2e-access
